<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Emisor de prueba</title>
</head>
<body>
  <script>
    // Dibuja una carta de ajuste animada y la codifica en H.264 con WebCodecs.
    // Cada cuadro codificado va al proceso principal, que lo publica por RTMP.
    const WIDTH = 640;
    const HEIGHT = 360;
    const FPS = 30;
    const canvas = document.createElement('canvas');
    canvas.width = WIDTH;
    canvas.height = HEIGHT;
    const ctx = canvas.getContext('2d');
    const bars = ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'];

    function draw(n) {
      const barWidth = WIDTH / bars.length;
      bars.forEach((color, i) => {
        ctx.fillStyle = color;
        ctx.fillRect(i * barWidth, 0, barWidth + 1, HEIGHT * 0.7);
      });
      ctx.fillStyle = '#111';
      ctx.fillRect(0, HEIGHT * 0.7, WIDTH, HEIGHT * 0.3);
      const x = (n * 6) % (WIDTH - 60);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, HEIGHT * 0.74, 60, HEIGHT * 0.2);
      ctx.font = 'bold 28px -apple-system, Helvetica, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('TENVEO · PRUEBA DE VIDEO', 24, 48);
      ctx.font = '20px Menlo, monospace';
      ctx.fillText(`cuadro ${n}`, 24, HEIGHT - 18);
    }

    function toBytes(source) {
      if (!source) return null;
      return ArrayBuffer.isView(source)
        ? new Uint8Array(source.buffer, source.byteOffset, source.byteLength).slice()
        : new Uint8Array(source).slice();
    }

    async function start() {
      const config = {
        codec: 'avc1.42E01F',
        width: WIDTH,
        height: HEIGHT,
        bitrate: 1_000_000,
        framerate: FPS,
        latencyMode: 'realtime',
        avc: { format: 'avc' },
      };
      const support = await VideoEncoder.isConfigSupported(config);
      if (!support.supported) {
        window.publisher.error('Este Electron no puede codificar H.264.');
        return;
      }
      const encoder = new VideoEncoder({
        output: (chunk, metadata) => {
          const data = new Uint8Array(chunk.byteLength);
          chunk.copyTo(data);
          window.publisher.send({
            key: chunk.type === 'key',
            timestamp: chunk.timestamp / 1000,
            data,
            description: toBytes(metadata?.decoderConfig?.description),
          });
        },
        error: (error) => window.publisher.error(String(error)),
      });
      encoder.configure(config);
      let n = 0;
      setInterval(() => {
        draw(n);
        const frame = new VideoFrame(canvas, { timestamp: Math.round((n * 1_000_000) / FPS) });
        encoder.encode(frame, { keyFrame: n % FPS === 0 });
        frame.close();
        n += 1;
      }, 1000 / FPS);
    }

    start().catch((error) => window.publisher.error(String(error)));
  </script>
</body>
</html>
